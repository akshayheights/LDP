# This is a Databricks asset bundle definition for sc_pipeline_1.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sc_pipeline_1
  uuid: a6a6e711-8be1-4e2f-9028-940eaab66ed6

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use
  notifications:
    description: The email addresses to use for failure notifications

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-665c9958-4027.cloud.databricks.com
    variables:
      catalog: ldp
      schema: ${workspace.current_user.short_name}
      notifications: []

  prod:
    mode: production
    workspace:
      host: https://dbc-665c9958-4027.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/akshayheights@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/akshayheights@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: akshayheights@gmail.com
        level: CAN_MANAGE
    variables:
      catalog: ldp
      schema: default
      notifications: [akshayheights@gmail.com]

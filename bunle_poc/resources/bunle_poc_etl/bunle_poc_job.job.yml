# The job that triggers bunle_poc_etl.

resources:
  jobs:
    bunle_poc_job:
      name: bunle_poc_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      tasks:
        - task_key: refresh_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.bunle_poc_etl.id}
        - task_key: postprocess
          depends_on:
            - task_key: refresh_pipeline
          notebook_task:
            notebook_path: /Workspace/Users/akshayheights@gmail.com/LDP/bunle_poc/resources/bunle_poc_etl/postprocess.py
            base_parameters:
              dlt_pipeline_id: ${resources.pipelines.bunle_poc_etl.id}
              dlt_pipeline_run_id: "{{tasks.refresh_pipeline.run_id}}"
              dlt_pipeline_result_state: "{{tasks.refresh_pipeline.result_state}}"
          job_cluster_key: bundle_cluster

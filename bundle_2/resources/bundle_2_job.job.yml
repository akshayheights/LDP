# The job that triggers bundle_1_pipeline.
resources:
  jobs:
    bundle_2_job:
      name: bundle_2_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      tasks:
        - task_key: refresh_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.bundle_2_pipeline.id}
